# =============================================================================
# ShopFlow — Nginx Load Balancer Configuration
# =============================================================================
# PURPOSE:
#   Acts as a reverse proxy and load balancer sitting in front of multiple
#   backend replicas. Distributes incoming API requests across 3 backend
#   containers using round-robin strategy.
#
# HOW IT WORKS:
#   1. Client sends request to Nginx (port 80)
#   2. Nginx checks the URL path:
#      - If it starts with /api → forward to one of the backend servers
#      - Otherwise → serve the frontend static files
#   3. For backend requests, Nginx picks the next server in the "upstream"
#      list (round-robin = take turns, one by one)
#
# ANALOGY:
#   Nginx = receptionist at a hospital
#   Upstream backends = 3 doctors
#   Receptionist sends each new patient to the next available doctor
# =============================================================================

# -----------------------------------------------------------------------------
# UPSTREAM BLOCK — Define the pool of backend servers
# -----------------------------------------------------------------------------
# "upstream" tells Nginx: "Here are the servers you can forward requests to."
# By default, Nginx uses ROUND-ROBIN — it cycles through them 1 → 2 → 3 → 1...
#
# Each server name (backend_1, backend_2, backend_3) is a Docker container name.
# Docker's internal DNS resolves these names to container IP addresses automatically.
# -----------------------------------------------------------------------------
upstream shopflow_backends {
    server backend_1:8080;
    server backend_2:8080;
    server backend_3:8080;
}

# -----------------------------------------------------------------------------
# SERVER BLOCK — The actual Nginx server listening for requests
# -----------------------------------------------------------------------------
server {
    # Listen on port 80 inside the container
    listen 80;

    # -------------------------------------------------------------------------
    # ROUTE 1: API Requests → Forward to Backend Pool
    # -------------------------------------------------------------------------
    # Any request starting with /api/ gets proxied to our upstream pool.
    # Nginx picks which backend to send it to (round-robin).
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://shopflow_backends;

        # --- Pass along the real client info to the backend ---
        # Without these, the backend would see Nginx's IP instead of the user's IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Timeouts ---
        # If a backend takes more than 60s to respond, Nginx gives up
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # ROUTE: Health Check → Forward to Backend Pool
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass http://shopflow_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # ROUTE 2: Everything Else → Serve Frontend
    # -------------------------------------------------------------------------
    # Non-API requests serve the React frontend (static HTML/CSS/JS files).
    # try_files attempts to find the file, falls back to index.html for SPA routing.
    # -------------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
